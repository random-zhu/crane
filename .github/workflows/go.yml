name: Go

on:
  pull_request:
    paths:
      - "cmd/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/go.yml"
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          gofmt -l cmd pkg | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - name: Reject removed Kubernetes APIs
        run: |
          if rg -n 'autoscaling/v2beta[12]|policy/v1beta1|runtime/v1alpha2' cmd pkg \
            --glob '*.go' --glob '!pkg/utils/hpa_conversion.go'; then
            exit 1
          fi
          if rg -n 'apiVersion: (autoscaling/v2beta[12]|policy/v1beta1|networking.k8s.io/v1beta1)' deploy charts \
            --glob '*.yaml' --glob '!deploy/manifests_1.13/**'; then
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - craned
          - crane-agent
          - metric-adapter
          - cost-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.target }}
        run: make ${{ matrix.target }}
