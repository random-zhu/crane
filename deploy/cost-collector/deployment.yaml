apiVersion: v1
kind: ServiceAccount
metadata:
  name: crane-cost-collector
  namespace: crane-cost-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crane-cost-collector
  namespace: crane-cost-system
  labels:
    app.kubernetes.io/name: crane-cost-collector
    app.kubernetes.io/part-of: crane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crane-cost-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crane-cost-collector
        app.kubernetes.io/part-of: crane
    spec:
      serviceAccountName: crane-cost-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cost-collector
          # Pin an immutable release tag or digest before production use.
          image: docker.io/gocrane/cost-collector:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /cost-collector
            - --config=/etc/crane-cost/config.json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/crane-cost
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/crane-cost
              readOnly: true
            - name: ledger
              mountPath: /var/lib/crane-cost
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: crane-cost-collector
        - name: credentials
          projected:
            sources:
              - secret:
                  name: crane-cost-credentials
                  items:
                    - key: api_token
                      path: api/token
                    - key: aliyun_access_key_id
                      path: aliyun/access_key_id
                    - key: aliyun_access_key_secret
                      path: aliyun/access_key_secret
                    - key: volcengine_access_key_id
                      path: volcengine/access_key_id
                    - key: volcengine_secret_access_key
                      path: volcengine/secret_access_key
                    - key: huawei_auth_token
                      path: huawei/auth_token
                    - key: tencent_secret_id
                      path: tencent/secret_id
                    - key: tencent_secret_key
                      path: tencent/secret_key
              - secret:
                  name: crane-cost-credentials
                  optional: true
                  items:
                    - key: aliyun_security_token
                      path: aliyun/security_token
                    - key: volcengine_session_token
                      path: volcengine/session_token
                    - key: tencent_token
                      path: tencent/token
        - name: ledger
          persistentVolumeClaim:
            claimName: crane-cost-ledger
        - name: tmp
          emptyDir: {}
