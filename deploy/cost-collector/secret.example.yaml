# Copy this file outside version control, replace every value, and create the
# Secret with your normal secret-management system. Do not commit credentials.
apiVersion: v1
kind: Secret
metadata:
  name: crane-cost-credentials
  namespace: crane-cost-system
type: Opaque
stringData:
  api_token: REPLACE_WITH_A_LONG_RANDOM_READ_ONLY_API_TOKEN
  aliyun_access_key_id: REPLACE_ME
  aliyun_access_key_secret: REPLACE_ME
  volcengine_access_key_id: REPLACE_ME
  volcengine_secret_access_key: REPLACE_ME
  huawei_auth_token: REPLACE_ME
  tencent_secret_id: REPLACE_ME
  tencent_secret_key: REPLACE_ME
# Optional short-lived credential keys, when issued by the provider:
#   aliyun_security_token
#   volcengine_session_token
#   tencent_token
