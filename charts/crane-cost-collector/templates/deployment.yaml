{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 while the file ledger backend is in use" }}
{{- end }}
{{- if not .Values.persistence.enabled }}
{{- fail "persistence.enabled must be true while the file ledger backend is in use" }}
{{- end }}
{{- if not .Values.credentials.existingSecret }}
{{- fail "credentials.existingSecret is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crane-cost-collector.fullname" . }}
  labels:
    {{- include "crane-cost-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "crane-cost-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ mustToJson .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "crane-cost-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crane-cost-collector.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cost-collector
          {{ if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{ else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /cost-collector
            - --config=/etc/crane-cost/config.json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/crane-cost
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/crane-cost
              readOnly: true
            - name: ledger
              mountPath: /var/lib/crane-cost
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "crane-cost-collector.fullname" . }}
        - name: credentials
          projected:
            sources:
              - secret:
                  name: {{ .Values.credentials.existingSecret }}
                  items:
                    {{- toYaml .Values.credentials.items | nindent 20 }}
              {{- with .Values.credentials.optionalItems }}
              - secret:
                  name: {{ $.Values.credentials.existingSecret }}
                  optional: true
                  items:
                    {{- toYaml . | nindent 20 }}
              {{- end }}
        - name: ledger
          persistentVolumeClaim:
            claimName: {{ include "crane-cost-collector.claimName" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
